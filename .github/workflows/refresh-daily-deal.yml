name: Refresh daily deal

on:
  schedule:
    # 6:15 AM EST / 7:15 AM EDT; GitHub schedules can be delayed.
    - cron: '15 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-daily-deal
  cancel-in-progress: false

jobs:
  trigger-cloudflare-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Trigger fresh Astro build through Cloudflare's Git integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TODAY="$(TZ=America/New_York date +%F)"
          git commit --allow-empty -m "chore: refresh daily deal for ${TODAY} [daily]"
          git push origin HEAD:main
